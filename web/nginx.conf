server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 250m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Reports need their own sandbox CSP and same-origin framing; retain the API's headers.
    location ~ ^/api/(eda/[0-9a-f-]+/report|ml/[0-9a-f-]+/report/[a-z]+)$ {
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    # Remote cleanup may process many recorded jobs before local removal completes.
    location ~ ^/api/(runs|eda|ml)/[0-9a-f-]+$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 900s;
    }
    # The API streams uploads and enforces PARCEL_UPLOAD_LIMIT_MB itself; no second limit here.
    location = /api/uploads {
        client_max_body_size 0;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
