[pytest]
testpaths = tests
pythonpath = src
norecursedirs = .* tmp _tmp* _pytest* __pycache__
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts = -ra
markers =
    slow: long-running integration tests
    e2e: end-to-end pipeline tests
filterwarnings =
    # affine 3 deprecates "*" for matrix multiplication; rasterio and rioxarray still use it internally.
    ignore:Use `@` matmul:PendingDeprecationWarning:rasterio\..*
    ignore:Use `@` matmul:PendingDeprecationWarning:rioxarray\..*
    # conda-forge netCDF4 ships a limited-API (abi3) Cython build whose ndarray size check is a false positive.
    ignore:numpy.ndarray size changed:RuntimeWarning
