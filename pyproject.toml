[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satellites"
version = "0.1.0"
description = "Satellite parcel statistics, exploratory analysis, and geospatial classification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy", "pandas", "geopandas", "pyarrow", "shapely", "pyproj",
    "scipy", "scikit-learn", "matplotlib", "seaborn", "joblib",
    "rasterio", "rioxarray", "xarray", "requests", "psutil", "tqdm",
]

[project.optional-dependencies]
acquisition = ["openeo", "boto3", "pystac-client", "h5netcdf", "netCDF4", "dask[array]", "openpyxl"]
database = ["psycopg2-binary", "sqlalchemy"]
ml = ["xgboost", "lightgbm", "imbalanced-learn", "shap"]
neural = ["tensorflow"]
interpolation = ["pykrige"]
notebooks = ["jupyterlab", "ipykernel"]
gis-utilities = ["ipython", "networkx", "dill", "fiona", "skimpy", "libpysal", "esda", "splot", "statsmodels", "ruptures"]
dev = ["pytest", "pytest-cov", "ruff", "radon", "pydocstyle", "bandit"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["data_preparation*", "eda*", "ml_classification*", "shared*"]
namespaces = false

[tool.coverage.run]
source = ["data_preparation", "eda", "ml_classification", "shared"]
data_file = "outputs/quality/.coverage"

[tool.coverage.xml]
output = "outputs/quality/coverage.xml"

[tool.coverage.html]
directory = "outputs/quality/htmlcov"
